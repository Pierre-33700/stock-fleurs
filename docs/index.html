<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<title>Stock Fleurs · démonstration</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
html{color-scheme:light dark}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Stock Fleurs<small>Sorties dans l'ordre d'arrivée (FIFO)</small></div>
    <div style="display:flex;gap:8px"><button class="theme" data-t="settings" type="button">Réglages</button><button class="theme" id="theme" type="button">Clair / sombre</button></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-t="stock" aria-selected="true">Stock</button>
    <button role="tab" data-t="in" aria-selected="false">+ Entrée</button>
    <button role="tab" data-t="out" aria-selected="false">− Sortie</button>
    <button role="tab" data-t="log" aria-selected="false">Journal</button>
  </nav>

  <main id="view"><p class="loading">Chargement…</p></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="api-local.js"></script>
<script src="app.js"></script>
</body>
</html>
